<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr. Baron Billiard Club — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* A4 at 96dpi */
  @page { size: 794px 1123px; margin: 0; }
  :root {
    --gold: #C9A45C;
    --gold-bright: #E2C47A;
    --gold-line: rgba(201, 164, 92, .55);
    --text: #ECE6D8;
    --bg: #0A0B0A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  .page {
    position: relative; width: 794px; height: 1123px; overflow: hidden;
    page-break-after: always; break-after: page;
    background:
      radial-gradient(ellipse 75% 32% at 50% 0%, rgba(22, 64, 38, .75) 0%, rgba(14, 38, 24, .35) 45%, transparent 80%),
      radial-gradient(ellipse at 50% 60%, #121412 0%, var(--bg) 85%);
    color: var(--text);
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* Double gold frame */
  .frame { position: absolute; inset: 22px; border: 1px solid var(--gold-line); pointer-events: none; }
  .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(201, 164, 92, .35); }

  .head { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
  .logo { display: block; width: 168px; margin: 0 auto;
    -webkit-mask-image: radial-gradient(circle, #000 60%, transparent 71%);
            mask-image: radial-gradient(circle, #000 60%, transparent 71%); }
  .kicker { font-family: 'Cinzel', serif; font-weight: 600; font-size: 15px; letter-spacing: 7px; padding-left: 7px;
    color: var(--gold); margin-top: 18px; }

  .cols { position: absolute; top: 262px; left: 57px; right: 57px; bottom: 90px;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; }
  .col { display: flex; flex-direction: column; gap: var(--section-gap, 18px); }

  h2 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 19px; letter-spacing: 3.5px; color: var(--gold);
    text-transform: uppercase; line-height: 1.2;
    display: flex; align-items: center; gap: 14px; margin-bottom: 6px; white-space: nowrap; }
  h2::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(90deg, var(--gold), transparent); }

  .row { display: flex; align-items: baseline; font-size: 14.5px; line-height: var(--row-h, 24px); }
  .row .name { white-space: nowrap; letter-spacing: .2px; }
  .row .dots { flex: 1; margin: 0 10px; border-bottom: 1px dashed rgba(201, 164, 92, .38); transform: translateY(-4px); min-width: 20px; }
  .row .price { font-weight: 600; color: var(--gold-bright); white-space: nowrap; text-align: right;
    font-variant-numeric: tabular-nums; }
  .row .price.w { width: 48px; }
  .row .price.w + .price.w { margin-left: 10px; }
  .sizes { display: flex; justify-content: flex-end; gap: 10px; margin: -6px 0 -2px; }
  .sizes span { width: 48px; text-align: right; font-family: 'Cinzel', serif; font-weight: 700; font-size: 9.5px;
    letter-spacing: .8px; color: var(--text); opacity: .9; }

  .foot { position: absolute; bottom: 46px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: 1px; color: var(--gold); }

  /* Page 2 is less dense — looser rows */
  .page.airy { --row-h: 30px; --section-gap: 30px; }
  .page.airy .cols { top: 280px; }

  /* Screenshot mode: ?p=N shows only that page */
  body.single .page { display: none; }
  body.single .page.on { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---- Menu content: edit names / prices here --------------------------------
// Each item is [name, price]. Wine items are [name, glass150ml, bottle750ml].
const S = {
  whiskey: ['Whiskey', [
    ['Jameson', '2200'], ["Jack Daniel's", '2500'], ['Jack Honey', '2500'], ['Jim Beam', '2200'],
    ['Chivas 12', '3500'], ['Glenfiddich 12', '3500'], ['Monkey Shoulder', '2800'],
  ]],
  gin: ['Gin', [['Beefeater', '1800'], ['Mom', '2200'], ['Bombay', '2500'], ["Hendrick's", '3500']]],
  rum: ['Rum', [['Bacardi White', '2200'], ['Bacardi Black', '2500'], ['Bacardi Spiced', '2000']]],
  tequila: ['Tequila', [
    ['Olmeca', '2000'], ['Don Julio Blanco', '3500'], ['Don Julio Reposado', '3600'], ['Milagro Silver', '2000'],
  ]],
  cognac: ['Cognac', [
    ['Ararat Cherry', '1500'], ['Ararat Apricot', '1500'], ['Ararat Coffee', '1500'], ['Ararat Akhtamar', '3000'],
  ]],
  wine: ['Wine &amp; Champagne', [
    ['Van Ardi Red', '1500', '5500'], ['Van Ardi White', '1500', '5500'], ['Ijevan Vard', '1500', '5500'],
    ['Zonin Prosecco', '—', '9000'],
  ], ['150 ML', '750 ML']],
  liqueur: ['Liqueur', [
    ['Campari', '1800'], ['Jägermeister', '2000'], ['Martini Rosso', '1500'], ['De Kuyper', '1500'],
    ['Midori', '2000'], ['Aperol', '2000'],
  ]],
  cocktail: ['Cocktail', [
    ['Negroni', '2200'], ['Long Island Ice Tea', '2500'], ['Margarita', '2000'], ['Daiquiri', '2000'],
    ['Aperol Spritz', '2000'], ['Special 1', '3500'], ['Special 2', '4500'], ['Mr Baron', '5000'],
  ]],
  beer: ['Beer', [['Corona', '1200'], ['Heineken', '1000'], ['Miller', '1000'], ['Kilikia', '800']]],
  coffee: ['Coffee', [
    ['Oriental', '600'], ['Espresso', '900'], ['Americano', '1000'], ['Cappuccino', '1200'], ['Latte', '1200'],
  ]],
  tea: ['Tea', [
    ['Black', '1000'], ['Green', '1000'], ['Thyme and Mint', '1000'], ['Sea Buckthorn', '1000'],
    ['Assam Leaf Blend', '1200'], ['Fruit', '1200'], ['Japan Sencha', '1200'], ['Milk Oolong', '1300'],
  ]],
  lemonades: ['Lemonades', [['Citrus', '1500'], ['Berry', '1500'], ['Mango', '1500'], ['Special', '2000 / 3000']]],
  soft: ['Soft Drinks', [
    ['Cola', '600'], ['Fanta', '600'], ['Sprite', '600'], ['Natural Juice', '600'], ['Jermuk', '500'],
    ['Byuregh', '500'], ['Tonic', '600'], ['Red Bull', '1200'],
  ]],
  snacks: ['Snacks', [
    ['Snickers', '700'], ['Bounty', '700'], ['Twix', '700'], ['Mars', '700'], ['Kinder Bueno', '700'],
    ['Milky Way', '700'], ["Lay's", '800'], ['Bruschette Maretti', '1000'], ['Ice Cream', '1000'],
  ]],
};

// ---- Pages: title under the logo, then left and right columns ---------------
const PAGES = [
  { kicker: 'Bar Menu', left: ['whiskey', 'gin', 'rum', 'tequila', 'cognac'], right: ['wine', 'liqueur', 'cocktail', 'beer'] },
  { kicker: 'Coffee · Tea · Drinks · Snacks', left: ['coffee', 'tea', 'lemonades'], right: ['soft', 'snacks'], airy: true },
];
const FOOTER = 'Tel: 095-035-006 &nbsp;·&nbsp; Prices in AMD';
// -----------------------------------------------------------------------------

function section(key) {
  const [title, items, sizes] = S[key];
  let h = `<section><h2>${title}</h2>`;
  if (sizes) h += `<div class="sizes">${sizes.map(s => `<span>${s}</span>`).join('')}</div>`;
  for (const [name, ...prices] of items) {
    const cls = prices.length > 1 ? 'price w' : 'price';
    h += `<div class="row"><span class="name">${name}</span><span class="dots"></span>${prices.map(p => `<span class="${cls}">${p}</span>`).join('')}</div>`;
  }
  return h + `</section>`;
}

document.getElementById('root').innerHTML = PAGES.map(p => `
  <div class="page${p.airy ? ' airy' : ''}">
    <div class="frame"></div>
    <div class="head">
      <img class="logo" src="logo.jpg" alt="Mr Baron Billiard Club">
      <div class="kicker">${p.kicker.toUpperCase()}</div>
    </div>
    <div class="cols">
      <div class="col">${p.left.map(section).join('')}</div>
      <div class="col">${p.right.map(section).join('')}</div>
    </div>
    <div class="foot">${FOOTER}</div>
  </div>`).join('');

const q = new URLSearchParams(location.search).get('p');
if (q) {
  document.body.classList.add('single');
  document.querySelectorAll('.page')[Number(q) - 1].classList.add('on');
}
</script>
</body>
</html>
